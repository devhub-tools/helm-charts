{{- if .Values.kubernetes.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devhub-tunnel
  labels:
    {{- include "DevhubTunnel.labels" . | nindent 4 }}
subjects:
