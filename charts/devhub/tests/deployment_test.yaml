suite: Deployment
templates:
  - deployment.yaml
release:
  name: devhub
  namespace: devhub

tests:
  - it: should render deployment with default values
    set:
      devhub:
        secret: devhub-config
        database:
          secret: devhub-private-postgres-app
    asserts:
      - matchSnapshot: {}

  - it: should render deployment with custom values
    set:
      devhub:
        secret: devhub-config
        auth:
          emailHeader: X-Forwarded-Email
          groupsHeader: X-Forwarded-Groups
        database:
          secret: devhub-private-postgres-app
          ssl:
            mode: verify
            caSecret: devhub-private-postgres-ca
            clientCertSecret: devhub-private-postgres-client-cert
        proxy:
          command: "cloudflared tunnel run"
          instructions: "Run the command above to start the proxy"
          tls:
            secret: proxy-tls

      resources:
        requests:
          cpu: 20m
        limits:
          memory: 512Mi

      tolerations:
        - key: key
          operator: Exists
          value: value
          effect: NoSchedule

    asserts:
      - matchSnapshot: {}

  - it: should ignore the removed devhub.agent value
    set:
      devhub:
        agent: true
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: AGENT
          any: true
      - lengthEqual:
          path: spec.template.spec.initContainers
          count: 2
      - contains:
          path: spec.template.spec.volumes
          content:
            name: database-config
          any: true

  - it: should set POOL_SIZE to 20 by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POOL_SIZE
            value: "20"

  - it: should set POOL_SIZE from devhub.database.poolSize
    set:
      devhub:
        database:
          poolSize: 5
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POOL_SIZE
            value: "5"

  - it: should fall back to 20 when devhub.database.poolSize is unset
    set:
      devhub:
        database:
          poolSize: null
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POOL_SIZE
            value: "20"

  - it: should not duplicate POOL_SIZE set in extraEnvVars
    set:
      extraEnvVars:
        - name: POOL_SIZE
          value: "40"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POOL_SIZE
          any: true
          count: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POOL_SIZE
            value: "40"
